<button class="btn js-toggle-dark-mode">Activate Dark Mode</button>

<script>
const toggleDarkMode = document.querySelector('.js-toggle-dark-mode');

jtd.addEvent(toggleDarkMode, 'click', function(){
  if (jtd.getTheme() === 'dark') {
    jtd.setTheme('light');
    toggleDarkMode.textContent = 'Activate Dark Mode';
  } else {
    jtd.setTheme('dark');
    toggleDarkMode.textContent = 'Activate Light Mode';
  }
});
</script>
